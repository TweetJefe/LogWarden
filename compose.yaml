services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: logwarden
      POSTGRES_USER: logwarden
      POSTGRES_PASSWORD: logwarden
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logwarden -d logwarden"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
